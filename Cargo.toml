[package]
name = "birdy"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.7.0"
bevy = { version = "0.19.1", features = ["webgpu", "wav"] }
bevy-inspector-egui = "0.37.0"
bevy_embedded_assets = "0.16.0"
leafwing-input-manager = "0.21.0"
shadow-rs = { version = "2.0.0", default-features = false }
virtual_joystick = "2.8.0"
bevy_hanabi = { version = "0.19", default-features = false, features = ["3d"] }
bevy_rand = { version = "0.15.2", features = ["wyrand"] }
rand = "0.10.2"
fundsp = "0.23.0"
hound = "3.5.1"

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
bevy_rand = { version = "0.15.2", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Navigator"] }

[build-dependencies]
shadow-rs = "2.0.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
# Allows full cross-module optimizations
lto = "thin"
opt-level = "s"
