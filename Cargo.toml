[package]
name = "birdy"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.7.0"
bevy = { version = "0.19.0" }
bevy-inspector-egui = "0.37.0"
leafwing-input-manager = "0.21.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
# Allows full cross-module optimizations
lto = true